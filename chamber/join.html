<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Join | Matola Chamber of Commerce</title>
    <meta name="description" content="Directory of businesses registered in the Matola Chamber of Commerce.">
    <meta name="author" content="Liedson Nhapulo">
    <meta property="og:title" content="Matola Chamber of Commerce Directory">
    <meta property="og:description" content="Directory of businesses in the Matola Chamber of Commerce.">
    <meta property="og:image" content="https://liedsonnhapulo-maker.github.io/wdd231/chamber/images/cubo.svg">
    <meta property="og:url" content="https://liedsonnhapulo-maker.github.io/wdd231/chamber/directory.html">
    <meta property="og:type" content="website">
    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/large.css">
    <script src="scripts/join.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/cubo.svg" alt="Matola Chamber of Commerce logo">
            <span>Matola Chamber of Commerce</span>
        </div>
        <button id="ham-btn" class="hamburger" aria-label="Open navigation menu" aria-expanded="false"></button>
        <nav id="nav-bar" class="navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="directory.html" class="active">Directory</a></li>
                <li><a href="join.html">Join</a></li>
                <li><a href="discover.html">Discover</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Join in Our Chamber</h1>
    <form method="get" action="thankyou.html">
    
        <label>
            First Name
            <input type="text" name="fname" title="Applicant first name" autocomplete="given-name" required>
        </label>
    
        <label>
            Last Name
            <input type="text" name="lname" title="Applicant last name" autocomplete="family-name" required>
        </label>
    
        <label>
            Organizational Title
            <input type="text" name="organization-title" title="Applicant organizational title"
                autocomplete="organization-title" pattern="[A-Za-z\s-]{7,}" required>
        </label>
    
        <label>
            Email
            <input type="email" name="email" title="Applicant email address" autocomplete="email"
                placeholder="example@email.com" required>
        </label>
    
        <label>
            Mobile Phone
            <input type="tel" name="phone" title="Applicant mobile phone number" autocomplete="tel" required>
        </label>
    
        <label>
            Organization Name
            <input type="text" name="organization" title="Business organization name" autocomplete="organization" required>
        </label>
    
        <label>
            Membership Level
            <select name="membership" title="Membership level">
                <option value="np">NP Membership</option>
                <option value="bronze">Bronze Membership</option>
                <option value="silver">Silver Membership</option>
                <option value="gold">Gold Membership</option>
            </select>
        </label>
    
        <label>
            Business Description
            <textarea name="description" title="Business organization description"></textarea>
        </label>
    
        <input type="hidden" name="timestamp" id="timestamp">
    
        <input type="submit" value="Submit Application">
    
    </form>
    <section class="membership-card">
        <h2>Membership Levels</h2>
        <h3>View the benefits of each level</h3>
        <button id="openButton1">NP Membership</button>
        <button id="openButton2">Bronze Membership</button>
        <button id="openButton3">Silver Membership</button>
        <button id="openButton4">Gold Membership</button>
        <dialog id="dialogBox">
            <div></div>
             <button id="closeButton">❌</button>
        </dialog>
    </section>
    
    </main>
    <footer>
        <div>
            <h2>Matola Chamber of Commerce</h2>
            <p>Matola, Maputo, Mozambique</p>
            <p>Email: info@matolachamber.com</p>
            <p>Phone: +258 84 000 0000</p>
        </div>
        <div>
            <p>© <span id="currentyear"></span> Liedson Nhapulo 👑 WDD231</p>
            <p><span id="lastModified"></span></p>
        </div>
    </footer>
</body>

</html>
