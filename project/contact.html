    <header>
        <div class="logo">
            <img src="images/solar-panel-sun.svg" alt="Renewable energy logo">

        </div>
        <button id="ham-btn" class="hamburger" aria-label="Open navigation menu" aria-expanded="false"></button>

            </ul>

    <main>
        <form class="contact-form" method="get" action="thankyou.html">
        
            <label>
                Full Name
                <input type="text" name="name" required>
            </label>
        
        
            <label>
                Email
                <input type="email" name="email" required>
            </label>
        
        
            <label>
                Phone Number
                <input type="tel" name="phone">
            </label>
        
        
            <label>
                Service Interest
        
                <select name="service">
        
                    <option value="">
                        Select a service
                    </option>
        
                    <option value="solar">
                        Solar System
                    </option>
        
                    <option value="smart">
                        Smart Energy
                    </option>
        
                    <option value="consultation">
                        Energy Consultation
                    </option>
        
                </select>
        
            </label>
        
        
            <label>
                Message
        
                <textarea name="message">
                </textarea>
        
            </label>
        
        
            <button type="submit">
                Send Message
            </button>
        
        
        </form>
    </main>
